name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore KariyerTakip.slnx
      - shell: pwsh
        run: ./scripts/AuditPackages.ps1
      - run: dotnet build KariyerTakip.slnx -c Release --no-restore
      - run: dotnet test KariyerTakip.slnx -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory artifacts/test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/test-results
