name: Windows installer check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'installer/**'
      - 'scripts/BuildInstaller.ps1'
      - 'scripts/SignReleaseFile.ps1'
      - 'scripts/TestInstaller.ps1'
      - 'KariyerTakip.csproj'
      - '.github/workflows/installer-check.yml'
  pull_request:
    paths:
      - 'installer/**'
      - 'scripts/*Installer.ps1'
      - '.github/workflows/installer-check.yml'
permissions:
  contents: read
jobs:
  install-and-uninstall:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet publish KariyerTakip.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o artifacts/publish/win-x64
      - shell: pwsh
        run: ./scripts/PrepareInstallerCompiler.ps1
      - shell: pwsh
        run: ./scripts/TestInstaller.ps1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: installer-test-logs
          path: tmp/installer-smoke*.log
