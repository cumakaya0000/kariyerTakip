name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test KariyerTakip.slnx -c Release
      - shell: pwsh
        run: ./scripts/AuditPackages.ps1
      - shell: pwsh
        run: ./scripts/Publish.ps1
      - shell: pwsh
        run: ./scripts/PrepareInstallerCompiler.ps1
      - shell: pwsh
        run: ./scripts/BuildInstaller.ps1
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/release-assets -Force | Out-Null
          Copy-Item -LiteralPath artifacts/publish/win-x64/KariyerTakip.exe -Destination artifacts/release-assets/KariyerTakip.exe
          $exeHash = (Get-FileHash -LiteralPath artifacts/release-assets/KariyerTakip.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("artifacts/release-assets/KariyerTakip.exe.sha256", "$exeHash  KariyerTakip.exe`n")
          Copy-Item -LiteralPath artifacts/KariyerTakip-Kurulum.exe -Destination artifacts/release-assets/KariyerTakip-Kurulum.exe
          Copy-Item -LiteralPath artifacts/KariyerTakip-Kurulum.exe.sha256 -Destination artifacts/release-assets/KariyerTakip-Kurulum.exe.sha256
          Copy-Item -LiteralPath artifacts/KariyerTakip-win-x64.zip -Destination artifacts/release-assets/KariyerTakip-win-x64.zip
          Copy-Item -LiteralPath artifacts/KariyerTakip-win-x64.zip.sha256 -Destination artifacts/release-assets/KariyerTakip-win-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: KariyerTakip-win-x64
          path: artifacts/release-assets/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: KariyerTakip-win-x64
          path: release-assets
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          $assets = Get-ChildItem -Path release-assets -File | ForEach-Object { $_.FullName }
          gh release create "$env:RELEASE_TAG" @assets --repo "$env:RELEASE_REPO" --notes-file CHANGELOG.md --clobber
